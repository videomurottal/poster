<!DOCTYPE html>
<html lang="en">
<head>

  <title>Poster Quran Video Maker</title>

  <!-- script utama -->
  <script src="script.js" defer></script>
  <style>
    body {
      font-family: sans-serif;

      padding: 2em;

    #pages {

      height: 500px;
      margin: auto;
      background: #222;
      color: white;
      display: flex;

      justify-content: center;
      font-size: 2rem;
      border-radius: 12px;
    }

      padding: 0.5em 1em;

    }

<body>

  <div id="pages">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</div>

  <div style="margin-top: 1.5em;">
    <select id="mp4Qari">
      <option value="AbdulSamad_64kbps_QuranExplorer.Com">Abdul Samad</option>
      <option value="Abdul_Basit_Murattal_64kbps">Abdul Basit</option>
      <option value="Mishari_Rashid_64kbps">Misyari Rasyid</option>
    </select>
    <input id="surah" value="001" placeholder="Surah (e.g. 001)" style="width:80px;">
    <input id="ayah" value="001" placeholder="Ayat (e.g. 001)" style="width:80px;">
    <br>

  </div>
</body>
</html>
