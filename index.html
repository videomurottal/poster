<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Poster Quran Video Maker</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.9/dist/ffmpeg.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 2em; }
    #pages { width: 500px; height: 500px; margin: auto; background: #222; color: white; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <h1>Poster Quran Video Maker</h1>
  <div id="pages">Contoh Poster Quran</div>

  <div style="margin: 1em 0;">
    <select id="mp4Qari">
      <option value="AbdulSamad_64kbps_QuranExplorer.Com">Abdul Bashit Murattal</option>
      <option value="Abdurrahmaan_As-Sudais_64kbps">Abdurrahmaan As-Sudais</option>
      <option value="Misyari_Rasyid_Al-Afasy_64kbps">Misyari Rasyid Al-Afasy</option>
    </select>
    <input id="surah" value="001" placeholder="Surah (e.g. 001)" style="width:80px;">
    <input id="ayah" value="001" placeholder="Ayat (e.g. 001)" style="width:80px;">
    <button onclick="generateVideo()">Download MP4</button>
  </div>

  <script>
    async function generateVideo() {
      const { createFFmpeg, fetchFile } = FFmpeg;
      const ffmpeg = createFFmpeg({ log: true, corePath: 'https://unpkg.com/@ffmpeg/core@0.12.2/dist/ffmpeg-core.js' });
      if (!ffmpeg.isLoaded()) await ffmpeg.load();

      const canvas = await html2canvas(document.getElementById("pages"), { scale: 2 });
      const dataUrl = canvas.toDataURL("image/png");
      const imageBlob = await (await fetch(dataUrl)).blob();
      const imageData = new Uint8Array(await imageBlob.arrayBuffer());
      ffmpeg.FS('writeFile', 'poster.png', imageData);

      const qari = document.getElementById('mp4Qari').value;
      const s = document.getElementById('surah').value;
      const a = document.getElementById('ayah').value;
      const audioUrl = `https://verses.quran.com/${qari}/${s}${a}.mp3`;
      const audioResp = await fetch(audioUrl);
      const audioData = new Uint8Array(await audioResp.arrayBuffer());
      ffmpeg.FS('writeFile', 'audio.mp3', audioData);

      await ffmpeg.run('-loop', '1', '-i', 'poster.png', '-i', 'audio.mp3', '-c:v', 'libvpx', '-c:a', 'libvorbis', '-shortest', 'output.webm');
      const output = ffmpeg.FS('readFile', 'output.webm');
      const videoBlob = new Blob([output.buffer], { type: 'video/webm' });
      const videoUrl = URL.createObjectURL(videoBlob);

      const aEl = document.createElement('a');
      aEl.href = videoUrl;
      aEl.download = `murottal-${s}-${a}.webm`;
      aEl.click();
    }
  </script>
</body>
</html>
