<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebM to MP4 Converter</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2em;
    }
    input {
      margin: 0.5em;
      padding: 0.75em;
      font-size: 1em;
    }
    #status {
      margin-top: 1em;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🎥 WebM to MP4 Converter</h1>
  <input type="file" id="webmInput" accept=".webm" onchange="upload(this.files[0])" />
  <p id="status">Pilih file WebM untuk dikonversi otomatis</p>

  <script>
    async function upload(file) {
      if (!file) return;

      const form = new FormData();
      form.append("file", file);

      const status = document.getElementById("status");
      status.innerText = "⏳ Mengunggah dan memproses...";

      try {
        const res = await fetch("https://mp4converter-production.up.railway.app/upload", {
          method: "POST",
          body: form
        });

        if (!res.ok) {
          status.innerText = "❌ Gagal mengunggah.";
          return;
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = file.name.replace(/\.webm$/, ".mp4");
        a.click();

        status.innerText = "✅ Konversi selesai. File terunduh.";
      } catch (err) {
        console.error(err);
        status.innerText = "❌ Terjadi kesalahan saat mengunggah.";
      }
    }
  </script>
</body>
</html>
