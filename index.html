<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- ... -->
  <style>
  /* Tambahan CSS untuk loader video */
  #videoLoaderOverlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255, 255, 255, 0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    display: none;
  }

  #videoLoaderOverlay div {
    border: 8px solid #f3f3f3;
    border-top: 8px solid #4cafef;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  </style>
</head>
<body>
  <!-- ... -->

  <div class="button-wrapper">
    <button id="saveVideoTrigger">Download Poster MP4</button>
  </div>

  <!-- Loader Overlay untuk video -->
  <div id="videoLoaderOverlay">
    <div></div>
  </div>

  <!-- Tambahkan library ffmpeg.js -->
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.10.0/dist/ffmpeg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <script>
  const saveVideoTrigger = document.getElementById("saveVideoTrigger");
  const videoLoaderOverlay = document.getElementById("videoLoaderOverlay");

  saveVideoTrigger.addEventListener("click", async () => {
    const node = document.getElementById("pages");
    const surah = surahSelect.value;
    const ayah = ayahSelect.value;
    const surahName = surahList[surah][0].replace(/[^a-zA-Z0-9]/g, "-");
    const filename = `${surahName}-${ayah}.mp4`;

    // Link audio MP3
    const audioUrl = `https://raw.githubusercontent.com/dickymiswardi/tadabbur/main/audio/Abdul_Basit_Mujawwad_128kbps/${surah.padStart(3, '0')}/${surah.padStart(3, '0')}${ayah.padStart(3, '0')}.mp3`;

    // Tampilkan loader overlay
    videoLoaderOverlay.style.display = "flex";

    try {
      const ffmpeg = FFmpeg.createFFmpeg({ log: true });
      await ffmpeg.load();

      // Ambil canvas sebagai gambar
      const canvas = await html2canvas(node, {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        backgroundColor: null
      });
      const imageBlob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));

      // Konversi canvas ke file
      const imageFile = new File([imageBlob], "poster.png");
      ffmpeg.FS("writeFile", "poster.png", new Uint8Array(await imageFile.arrayBuffer()));

      // Unduh file audio MP3
      const audioResponse = await fetch(audioUrl);
      const audioBlob = await audioResponse.blob();
      const audioFile = new File([audioBlob], "ayah.mp3");
      ffmpeg.FS("writeFile", "ayah.mp3", new Uint8Array(await audioFile.arrayBuffer()));

      // Gabungkan gambar dan audio menjadi video MP4
      await ffmpeg.run(
        "-loop", "1",
        "-i", "poster.png",
        "-i", "ayah.mp3",
        "-c:v", "libx264",
        "-tune", "stillimage",
        "-c:a", "aac",
        "-b:a", "192k",
        "-pix_fmt", "yuv420p",
        "-shortest",
        "output.mp4"
      );

      // Ambil file video hasilnya
      const videoData = ffmpeg.FS("readFile", "output.mp4");
      const videoBlob = new Blob([videoData.buffer], { type: "video/mp4" });
      saveAs(videoBlob, filename);

    } catch (err) {
      alert("❌ Gagal membuat video: " + err.message);
      console.error(err);
    } finally {
      // Sembunyikan loader overlay
      videoLoaderOverlay.style.display = "none";
    }
  });
  </script>
</body>
</html>
