<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Poster Quran ke MP4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: sans-serif; padding: 1em; background: #fefcf8; }
    .button { padding: 0.7em 1.5em; background: #4caf50; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; }
    .button[disabled] { background: #aaa; cursor: not-allowed; }
    #poster {
      width: 600px; height: 340px;
      background: #fefce8;
      border: 2px solid #ccc;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 1em;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<h2>Poster Quran ke MP4</h2>
<p>Gabungkan gambar poster & audio ayat jadi video MP4 (dengan FFmpeg di browser)</p>

<!-- Poster -->
<div id="poster">
  <h1 style="font-size: 2em;">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</h1>
</div>

<!-- Tombol -->
<button class="button" id="downloadBtn" disabled>Download MP4</button>

<!-- Loader Overlay -->
<div id="loaderOverlay" style="
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.8);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  display: none;">
  <div style="
    border: 8px solid #f3f3f3;
    border-top: 8px solid #4cafef;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    animation: spin 1s linear infinite;">
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.5/dist/ffmpeg.min.js"></script>
<script>
let ffmpeg;
let fetchFile;
let ffmpegReady = false;

window.addEventListener("DOMContentLoaded", async () => {
  const loader = document.getElementById("loaderOverlay");
  loader.style.display = "flex";

  const FFmpegLib = FFmpeg;
  fetchFile = FFmpegLib.fetchFile;
  ffmpeg = FFmpegLib.createFFmpeg({ log: true });

  try {
    console.log("⏳ Memuat FFmpeg...");
    await ffmpeg.load();
    ffmpegReady = true;
    console.log("✅ FFmpeg siap!");
    document.getElementById("downloadBtn").disabled = false;
  } catch (err) {
    alert("❌ Gagal memuat FFmpeg: " + err.message);
    console.error(err);
  } finally {
    loader.style.display = "none";
  }
});

document.getElementById("downloadBtn").addEventListener("click", async () => {
  const loader = document.getElementById("loaderOverlay");
  loader.style.display = "flex";

  try {
    const poster = document.getElementById("poster");
    const canvas = await html2canvas(poster, { scale: 2 });
    const posterBlob = await new Promise(res => canvas.toBlob(res, "image/png"));

    const audioUrl = "https://everyayah.com/data/AbdulSamad_64kbps_QuranExplorer.Com/001001.mp3";
    const audioRes = await fetch(audioUrl);
    if (!audioRes.ok) throw new Error("Gagal ambil audio MP3.");
    const audioBlob = await audioRes.blob();

    ffmpeg.FS("writeFile", "poster.png", await fetchFile(posterBlob));
    ffmpeg.FS("writeFile", "audio.mp3", await fetchFile(audioBlob));

    await ffmpeg.run(
      "-loop", "1", "-i", "poster.png", "-i", "audio.mp3",
      "-c:v", "libx264", "-tune", "stillimage",
      "-c:a", "aac", "-b:a", "192k", "-shortest",
      "-pix_fmt", "yuv420p", "output.mp4"
    );

    const data = ffmpeg.FS("readFile", "output.mp4");
    const videoBlob = new Blob([data.buffer], { type: "video/mp4" });
    const url = URL.createObjectURL(videoBlob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "PosterQuran.mp4";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    alert("✅ Video berhasil dibuat!");
  } catch (err) {
    alert("❌ Gagal: " + err.message);
    console.error(err);
  } finally {
    loader.style.display = "none";
  }
});
</script>

</body>
</html>
