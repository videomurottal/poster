<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Gabungkan Video + Audio</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f7f7f7;
      padding: 2rem;
      max-width: 600px;
      margin: auto;
    }
    input, button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      font-size: 1rem;
    }
    #result {
      margin-top: 2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Gabungkan Video dan Audio (MP4 Converter)</h2>

  <input type="url" id="videoUrl" placeholder="URL Video (tanpa audio)" required>
  <input type="url" id="audioUrl" placeholder="URL Audio (mp3/m4a)" required>

  <button onclick="gabungkan()">🔁 Gabungkan Video + Audio</button>

  <div id="result"></div>

  <script>
    async function gabungkan() {
      const video = document.getElementById("videoUrl").value.trim();
      const audio = document.getElementById("audioUrl").value.trim();
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "⏳ Memproses...";

      try {
        const baseUrl = "https://mp4converter.up.railway.app/convert";
        const url = `${baseUrl}?video=${encodeURIComponent(video)}&audio=${encodeURIComponent(audio)}`;
        
        // Mulai fetch (trigger penggabungan)
        const response = await fetch(url);
        if (!response.ok) throw new Error("Gagal proses video");

        // Buat link download
        resultDiv.innerHTML = `
          ✅ Sukses! <br>
          <a href="${url}" target="_blank" download>⬇️ Klik di sini untuk download MP4</a>
        `;
      } catch (err) {
        resultDiv.innerHTML = "❌ Terjadi kesalahan: " + err.message;
      }
    }
  </script>

</body>
</html>
